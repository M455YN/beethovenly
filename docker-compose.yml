services:
  # PO tokens for yt-dlp — required on most server IPs (YouTube GVS).
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: beethovenly-pot
    restart: unless-stopped
    ports:
      - "127.0.0.1:4416:4416"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Optional Chromium for cookie export only.
  # docker compose --profile cookies up -d
  chromium:
    profiles: ["cookies"]
    image: lscr.io/linuxserver/chromium:latest
    container_name: beethovenly-chromium
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Warsaw}
      CHROME_CLI: ${CHROME_CLI:---password-store=basic https://www.youtube.com/robots.txt}
      CUSTOM_USER: ${CHROMIUM_USER:-}
      PASSWORD: ${CHROMIUM_PASSWORD:-}
    volumes:
      - chromium-config:/config
    ports:
      - "${CHROMIUM_BIND:-127.0.0.1}:${CHROMIUM_HTTP_PORT:-3000}:3000"
      - "${CHROMIUM_BIND:-127.0.0.1}:${CHROMIUM_HTTPS_PORT:-3001}:3001"
    shm_size: "1gb"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  beethovenly:
    build: .
    container_name: beethovenly
    restart: unless-stopped
    # Discord Voice needs real UDP. Host networking reaches pot on 127.0.0.1:4416.
    network_mode: host
    depends_on:
      - pot-provider
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      COMMAND_GUILD_ID: ${COMMAND_GUILD_ID:-}
      BOT_STATUS: ${BOT_STATUS:-/play • beethovenly}
      IDLE_DISCONNECT_SECONDS: ${IDLE_DISCONNECT_SECONDS:-300}
      PLAYLIST_LIMIT: ${PLAYLIST_LIMIT:-50}
      # Cookies OFF by default — bad dumps cause "Sign in to confirm you're not a bot".
      # Only enable after a valid robots.txt export: YOUTUBE_USE_COOKIES=1
      YOUTUBE_USE_COOKIES: ${YOUTUBE_USE_COOKIES:-0}
      COOKIES_FILE: ${COOKIES_FILE:-}
      COOKIES_FROM_BROWSER: ${COOKIES_FROM_BROWSER:-}
      COOKIES_REFRESH: ${COOKIES_REFRESH:-0}
      YOUTUBE_POT_BASE_URL: ${YOUTUBE_POT_BASE_URL:-http://127.0.0.1:4416}
      # Residential/HTTP proxy for yt-dlp (OVH/datacenter IPs get YouTube bot-check).
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      SKIP_YTDLP_UPDATE: ${SKIP_YTDLP_UPDATE:-}
    volumes:
      - ./data:/app/data
      - chromium-config:/chrome-profile:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chromium-config:

services:
  # Optional: Chromium UI for exporting YouTube cookies when anon/mpv+ytdl is blocked.
  # Start with: docker compose --profile cookies up -d
  chromium:
    profiles: ["cookies"]
    image: lscr.io/linuxserver/chromium:latest
    container_name: beethovenly-chromium
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Warsaw}
      CHROME_CLI: ${CHROME_CLI:---password-store=basic https://www.youtube.com/robots.txt}
      CUSTOM_USER: ${CHROMIUM_USER:-}
      PASSWORD: ${CHROMIUM_PASSWORD:-}
    volumes:
      - chromium-config:/config
    ports:
      - "${CHROMIUM_BIND:-127.0.0.1}:${CHROMIUM_HTTP_PORT:-3000}:3000"
      - "${CHROMIUM_BIND:-127.0.0.1}:${CHROMIUM_HTTPS_PORT:-3001}:3001"
    shm_size: "1gb"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: PO tokens for yt-dlp when server IPs get YouTube bot-check.
  pot-provider:
    profiles: ["cookies"]
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: beethovenly-pot
    restart: unless-stopped
    ports:
      - "127.0.0.1:4416:4416"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  beethovenly:
    build: .
    container_name: beethovenly
    restart: unless-stopped
    # Discord Voice needs real UDP. Host networking avoids Docker NAT issues on Linux.
    network_mode: host
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      COMMAND_GUILD_ID: ${COMMAND_GUILD_ID:-}
      BOT_STATUS: ${BOT_STATUS:-/play • beethovenly}
      IDLE_DISCONNECT_SECONDS: ${IDLE_DISCONNECT_SECONDS:-300}
      PLAYLIST_LIMIT: ${PLAYLIST_LIMIT:-50}
      # Cookies are optional — leave unset for Wagner-style mpv+ytdl / anon playback.
      COOKIES_FILE: ${COOKIES_FILE:-}
      COOKIES_FROM_BROWSER: ${COOKIES_FROM_BROWSER:-}
      COOKIES_REFRESH: ${COOKIES_REFRESH:-0}
      YOUTUBE_POT_BASE_URL: ${YOUTUBE_POT_BASE_URL:-http://127.0.0.1:4416}
      SKIP_YTDLP_UPDATE: ${SKIP_YTDLP_UPDATE:-}
    volumes:
      - ./data:/app/data
      - chromium-config:/chrome-profile:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chromium-config:

services:
  # Persistent Chromium with web UI (one-time YouTube login).
  # After VNC: http://127.0.0.1:3000 → log into YouTube → restart beethovenly.
  chromium:
    image: lscr.io/linuxserver/chromium:latest
    container_name: beethovenly-chromium
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Warsaw}
      CHROME_CLI: ${CHROME_CLI:---password-store=basic https://www.youtube.com/robots.txt}
      CUSTOM_USER: ${CHROMIUM_USER:-}
      PASSWORD: ${CHROMIUM_PASSWORD:-}
    volumes:
      - chromium-config:/config
    ports:
      - "${CHROMIUM_BIND:-127.0.0.1}:${CHROMIUM_HTTP_PORT:-3000}:3000"
      - "${CHROMIUM_BIND:-127.0.0.1}:${CHROMIUM_HTTPS_PORT:-3001}:3001"
    shm_size: "1gb"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Proof-of-origin tokens for yt-dlp (helps bypass YouTube bot-check on server IPs).
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: beethovenly-pot
    restart: unless-stopped
    ports:
      - "127.0.0.1:4416:4416"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  beethovenly:
    build: .
    container_name: beethovenly
    restart: unless-stopped
    # Discord Voice needs real UDP. Host networking avoids Docker NAT issues on Linux.
    # Also reaches pot-provider at 127.0.0.1:4416.
    network_mode: host
    depends_on:
      - chromium
      - pot-provider
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      COMMAND_GUILD_ID: ${COMMAND_GUILD_ID:-}
      BOT_STATUS: ${BOT_STATUS:-/play • beethovenly}
      IDLE_DISCONNECT_SECONDS: ${IDLE_DISCONNECT_SECONDS:-300}
      PLAYLIST_LIMIT: ${PLAYLIST_LIMIT:-50}
      COOKIES_FILE: ${COOKIES_FILE:-/app/data/cookies.txt}
      COOKIES_FROM_BROWSER: ${COOKIES_FROM_BROWSER:-chromium+basictext:/chrome-profile/.config/chromium}
      # Set to 1 only after exporting from robots.txt (see README) — avoid rotating live cookies.
      COOKIES_REFRESH: ${COOKIES_REFRESH:-0}
      YOUTUBE_POT_BASE_URL: ${YOUTUBE_POT_BASE_URL:-http://127.0.0.1:4416}
      SKIP_YTDLP_UPDATE: ${SKIP_YTDLP_UPDATE:-}
    volumes:
      - ./data:/app/data
      - chromium-config:/chrome-profile:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  chromium-config:
